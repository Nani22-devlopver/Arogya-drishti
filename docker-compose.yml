services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aarogya_drishti
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aarogya_drishti"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/aarogya_drishti
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-not-for-production}
      STORAGE_DIR: /data/storage
      SEED_ON_START: "true"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
